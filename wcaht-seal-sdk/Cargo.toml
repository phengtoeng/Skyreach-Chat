[package]
name = "wcaht-seal-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real WCAHT integration: read live finality + anchor seals as native WCAHT transactions. Implements seal_core::SealChain."

[dependencies]
seal-core = { path = "../seal-core" }
seal-crypto = { path = "../seal-crypto" }
anyhow = "1"
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ed25519-dalek = "2"
blake3 = "1"
bs58 = "0.5"
hex = "0.4"
tiny_http = "0.12"

[[bin]]
name = "wcaht-seal-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "wcaht-seal-live-demo"
path = "src/bin/live_demo.rs"

[[bin]]
name = "wcaht-seal-anchor"
path = "src/bin/anchor.rs"

[[bin]]
name = "wcaht-seal-relay"
path = "src/bin/relay_server.rs"

[[bin]]
name = "wcaht-seal-fast-e2e"
path = "src/bin/fast_e2e.rs"

[[bin]]
name = "wcaht-seal-stake"
path = "src/bin/stake.rs"

[[bin]]
name = "wcaht-seal-directory"
path = "src/bin/directory_server.rs"

[[bin]]
name = "wcaht-seal-dir-demo"
path = "src/bin/dir_demo.rs"

[[bin]]
name = "wcaht-seal-dir-register"
path = "src/bin/dir_register.rs"
