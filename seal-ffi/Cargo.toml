[package]
name = "seal-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI over seal-core for the iOS/Android Flutter app (dart:ffi)."

[lib]
name = "seal_ffi"
# staticlib -> iOS (link into the app), cdylib -> Android (.so), rlib -> desktop tests
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
seal-core = { path = "../seal-core" }
seal-crypto = { path = "../seal-crypto" }
serde_json = "1"
hex = "0.4"
bs58 = "0.5" # anchor addresses are base58, same encoding as a WCAHT address
# JNI bridge for the native Android (Kotlin) app. Swift/iOS uses the C ABI directly.
jni = "0.21"
